[project]
name = "rosso-side-effect-safety"
version = "0.1.0"
description = "Local experiments for ambiguous-completion side effects in MCP agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "mcp>=2,<3",
  "openai>=2,<3",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
